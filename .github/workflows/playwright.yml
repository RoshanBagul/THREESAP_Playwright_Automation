name: Playwright Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CI: true
      TEST_ENV: staging
      ORANGEHRM_BASE_URL: ${{ vars.ORANGEHRM_BASE_URL }}
      ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
      ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}
      ORANGEHRM_ESS_USERNAME: ${{ secrets.ORANGEHRM_ESS_USERNAME }}
      ORANGEHRM_ESS_PASSWORD: ${{ secrets.ORANGEHRM_ESS_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Validate required configuration
        shell: bash
        run: |
          if [ -z "$ORANGEHRM_BASE_URL" ]; then
            echo "::error::Configure ORANGEHRM_BASE_URL as a GitHub Actions variable."
            exit 1
          fi
          if [ -z "$ORANGEHRM_USERNAME" ] || [ -z "$ORANGEHRM_PASSWORD" ]; then
            echo "::error::Configure ORANGEHRM_USERNAME and ORANGEHRM_PASSWORD as GitHub Actions secrets."
            exit 1
          fi

      - name: Run Playwright tests
        run: npm run test:allure

      - name: Generate Allure HTML report
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -n "$(find allure-results -type f -print -quit 2>/dev/null)" ]; then
            npm run allure:report
          else
            echo "No Allure results were generated."
          fi

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            playwright-report/
            test-results/
            allure-results/
            allure-report/
          if-no-files-found: ignore
          retention-days: 14